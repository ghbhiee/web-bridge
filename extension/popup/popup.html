<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Web Bridge</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --chip:#f3f4f6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16181c; --fg:#e6e6e6; --muted:#9aa0a6; --line:#2a2e35; --accent:#7cb7ff; --ok:#4ade80; --bad:#f87171; --chip:#22262d; }
  }
  * { box-sizing: border-box; }
  body { width: 420px; max-height: 580px; margin:0; padding:0; background:var(--bg); color:var(--fg);
         font: 13px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px; }
  header h1 { font-size:14px; margin:0; font-weight:600; flex:1; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--bad); }
  .dot.on { background:var(--ok); }
  .sub { padding:8px 14px; color:var(--muted); font-size:11.5px; border-bottom:1px solid var(--line);
         white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .group { padding:10px 14px 4px; font-size:11px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
  ul { list-style:none; margin:0; padding:0 8px 12px; }
  li { border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin:0 6px 7px; }
  li:hover { border-color:var(--accent); }
  .row { display:flex; align-items:baseline; gap:7px; }
  .title { font-weight:600; }
  .kind { font-size:10px; color:var(--muted); background:var(--chip); border-radius:4px; padding:1px 6px; }
  .id { font-size:10.5px; color:var(--muted); margin-left:auto; font-family: ui-monospace, monospace; }
  .desc { color:var(--muted); font-size:11.5px; margin-top:3px; }
  .params { color:var(--muted); font-size:10.5px; margin-top:4px; font-family: ui-monospace, monospace; }
  .cmd { margin-top:6px; font-family: ui-monospace, monospace; font-size:10.5px; background:var(--chip);
         padding:5px 7px; border-radius:5px; cursor:pointer; word-break:break-all; }
  .cmd:hover { outline:1px solid var(--accent); }
  .empty { padding:22px 14px; color:var(--muted); text-align:center; }
  /* --- run panel --- */
  .head { cursor:pointer; }
  .form { margin-top:8px; border-top:1px dashed var(--line); padding-top:8px; display:none; }
  li.open .form { display:block; }
  .field { display:flex; align-items:center; gap:8px; margin-bottom:5px; }
  .field label { flex:0 0 108px; color:var(--muted); font-size:11px; overflow:hidden;
                 text-overflow:ellipsis; white-space:nowrap; }
  .field input[type=text], .field input[type=number], .field select {
    flex:1; min-width:0; background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:5px; padding:3px 6px; font:inherit; font-size:11.5px; }
  .field input:focus, .field select:focus { outline:1px solid var(--accent); border-color:var(--accent); }
  .req { color:var(--bad); }
  .actions { display:flex; gap:8px; align-items:center; margin-top:7px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:4px 12px;
           font:inherit; font-size:11.5px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:var(--chip); color:var(--fg); font-weight:500; }
  .out { margin-top:7px; background:var(--chip); border-radius:6px; padding:6px 8px; max-height:190px;
         overflow:auto; font-family: ui-monospace, monospace; font-size:10.5px; white-space:pre-wrap;
         word-break:break-word; display:none; }
  .out.show { display:block; }
  .out.err { color:var(--bad); }
  .hint { color:var(--muted); font-size:10.5px; }
  footer { padding:8px 14px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; display:flex; gap:10px; }
  a { color:var(--accent); text-decoration:none; cursor:pointer; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <h1>Web Bridge</h1>
    <a id="reload">重载扩展</a>
  </header>
  <div class="sub" id="url">读取中…</div>
  <div id="body"><div class="empty">加载能力中…</div></div>
  <footer>
    <span id="count"></span>
    <span style="margin-left:auto">点标题展开 → 填参数 → 运行</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
